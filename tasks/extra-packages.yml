---
- name: Install global Composer packages.
  composer:
    command: "{{ (item.state | default('present') == 'absent') | ternary('remove', 'require') }}"
    arguments: "{{ item.name | default(item) }} {{ item.version | default('@stable') }}"
    # Ansible 2.4 supports `global_command` making `working_dir` optional.
    working_dir: "{{ lookup('env', 'COMPOSER_HOME') | default('~/.composer', true) }}"
  loop: "{{ composer_packages }}"

- name: Install global NPM packages.
  npm:
    name: "{{ item.name | default(item) }}"
    state: "{{ item.state | default('present') }}"
    version: "{{ item.version | default(omit) }}"
    global: true
    executable: "{{ item.executable | default(omit) }}"
  loop: "{{ npm_packages }}"

- name: Install global Pip packages.
  pip:
    name: "{{ item.name | default(item) }}"
    state: "{{ item.state | default('present') }}"
    version: "{{ item.version | default(omit) }}"
    executable: "{{ item.executable | default('pip3') }}"
  loop: "{{ pip_packages }}"

- name: Install global Ruby gems.
  gem:
    name: "{{ item.name | default(item) }}"
    state: "{{ item.state | default('present') }}"
    version: "{{ item.version | default(omit) }}"
    user_install: false
    executable: "{{ item.executable | default(omit) }}"
  loop: "{{ gem_packages }}"

- name: Ensure pipx application directory is on PATH.
  ansible.builtin.command:
    argv:
      - "{{ pipx_executable }}"
      - ensurepath
  changed_when: false
  when:
    - pipx_packages | default([]) | length > 0
    - pipx_ensurepath

- name: Install global Python applications via pipx.
  community.general.pipx:
    name: "{{ item.name | default(item) if item is mapping else item }}"
    state: "{{ item.state | default('present') if item is mapping else 'present' }}"
    executable: "{{ item.executable | default(pipx_executable) if item is mapping else pipx_executable }}"
  loop: "{{ pipx_packages | default([]) }}"
  environment: "{{ {} if (item.state | default('present') if item is mapping else 'present') == 'absent' else {'PIPX_DEFAULT_BACKEND': item.backend | default(pipx_default_backend) if item is mapping else pipx_default_backend} }}"
